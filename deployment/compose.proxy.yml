# Standalone local reverse-proxy stack; do not combine with compose.yml.
services:
  orbit:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    environment:
      AI_HOST: 0.0.0.0
      AI_PORT: "8443"
      ORBIT_ALLOW_TLS_BIND: "1"
      ORBIT_HTTPS_ORIGIN: "https://localhost:9443"
      ORBIT_TLS_CERT: /tls/cert.pem
      ORBIT_TLS_KEY: /tls/key.pem
      AI_PROVIDER: demo
    volumes:
      - proxy-data:/data
      - ./proxy-tls/upstream:/tls:ro
    networks: [private]
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
  proxy:
    image: nginx:alpine
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    depends_on: [orbit]
    ports: ["127.0.0.1:9443:9443"]
    networks: [private, edge]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy-tls/edge:/edge-tls:ro
      - ./proxy-tls/trust:/trust:ro
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 1
networks:
  private:
    internal: true
  edge:
volumes:
  proxy-data:
