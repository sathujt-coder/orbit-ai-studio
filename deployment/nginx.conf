# Local staging only. Direct TLS upstream is verified, never trust client forwarded headers.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    server_tokens off;
    log_format safe '$remote_addr $request_method $status $request_time';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 30k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;
    limit_req_zone $binary_remote_addr zone=api:1m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    limit_req_status 429;
    limit_conn_status 429;
    server {
        listen 9443 ssl;
        server_name localhost;
        ssl_certificate /edge-tls/cert.pem;
        ssl_certificate_key /edge-tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        if ($http_host != "localhost:9443") { return 421; }
        limit_conn connections 16;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:9443;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Forwarded "";
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /trust/upstream.pem;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 610s;
        location = /api/auth/login {
            limit_req zone=login burst=4 nodelay;
            proxy_pass https://orbit:8443;
        }
        location / {
            limit_req zone=api burst=40 nodelay;
            proxy_pass https://orbit:8443;
        }
    }
}
