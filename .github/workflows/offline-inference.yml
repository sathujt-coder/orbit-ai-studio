name: Offline inference — actual local models
on:
  pull_request:
    paths:
      - backend/model_provider.py
      - backend/product_requirements.py
      - backend/project_planning.py
      - backend/work_breakdown.py
      - backend/wbs_decomposition.py
      - backend/decomposition_jobs.py
      - tests/test_wbs_decomposition.py
      - tests/test_work_breakdown.py
      - backend/planning_discovery.py
      - backend/planning_scope.py
      - backend/planning_constraints.py
      - tests/test_planning_scope.py
      - tests/test_planning_repair.py
      - backend/planning_jobs.py
      - backend/planning_review.py
      - backend/planning_adoption.py
      - backend/resource_estimates.py
      - backend/sprint_schedule.py
      - tools/offline_planning_smoke.py
      - tools/planning_fixture.py
      - tests/test_planning_discovery.py
      - backend/requirements_jobs.py
      - backend/requirements_discovery.py
      - backend/requirements_scope.py
      - tools/offline_requirements_smoke.py
      - tests/test_requirements_discovery.py
      - tests/test_requirements_scope.py
      - backend/provider_settings.py
      - backend/usage_store.py
      - backend/cost_store.py
      - backend/resource_manager.py
      - backend/agent_queue.py
      - backend/concurrency_control.py
      - backend/model_routing.py
      - backend/inference_guard.py
      - backend/monitoring.py
      - tools/offline_stress.py
      - tools/stress_common.py
      - tools/offline_budget_smoke.py
      - tools/offline_routing_smoke.py
      - tools/offline_concurrency_smoke.py
      - tools/resource_container_evidence.py
      - backend/coding_factory.py
      - backend/server.py
      - tools/offline_sandbox_gate.py
      - tools/offline_generation.py
      - tools/offline_inference_smoke.py
      - tools/model_cache.py
      - tests/test_model_cache.py
      - tools/setup_offline_models.sh
      - tools/run_offline_models.sh
      - .github/workflows/offline-inference.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare model cache directory
        run: mkdir -p "$RUNNER_TEMP/orbit-ollama-models" "$RUNNER_TEMP/offline-report"
      - name: Restore model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/orbit-ollama-models
          key: orbit-ollama-models-v2-${{ runner.os }}-${{ runner.arch }}-qwen25-3b-pair-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            orbit-ollama-models-v2-${{ runner.os }}-${{ runner.arch }}-qwen25-3b-pair-
      - name: Prepare model files in temporary download container
        id: prepare-models
        env:
          ORBIT_CACHE_MATCHED_KEY: ${{ steps.model-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          models="$RUNNER_TEMP/orbit-ollama-models"
          report="$RUNNER_TEMP/offline-report/model-cache.json"
          echo "Cache restore: ${ORBIT_CACHE_MATCHED_KEY:-MISS}"
          docker pull ollama/ollama:latest
          docker pull python:3.12-slim
          docker image inspect ollama/ollama:latest --format '{{index .RepoDigests 0}}'
          if python tools/model_cache.py verify --root "$models" --report "$report"; then
            echo "Verified cache HIT; no registry model pulls"
          else
            status=$?
            test "$status" -eq 2  # only absent/corrupt models are repairable
            docker run -d --name orbit-download --user "$(id -u):$(id -g)" -e HOME=/tmp -e OLLAMA_NO_CLOUD=1 -e OLLAMA_MODELS=/models -v "$models:/models" ollama/ollama:latest
            for i in $(seq 1 60); do
              if docker exec orbit-download ollama list; then break; fi
              sleep 1
            done
            docker exec orbit-download ollama list
            # The download daemon runs as the runner UID/GID so repair and cache save can write.
            status=0
            python tools/model_cache.py ensure --root "$models" --docker-container orbit-download --report "$report" || status=$?
            docker rm -f orbit-download
            test "$status" -eq 0
          fi
          python -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p["gate"]=="PASS"; print("downloaded="+("true" if p["downloaded_models"] else "false"))' "$report" >> "$GITHUB_OUTPUT"
      - name: Save verified model cache
        if: steps.prepare-models.outputs.downloaded == 'true' || steps.model-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/orbit-ollama-models
          key: ${{ steps.model-cache.outputs.cache-primary-key }}
      - name: Select exact verified cache key for round trip
        id: cache-roundtrip
        env:
          PRIMARY_KEY: ${{ steps.model-cache.outputs.cache-primary-key }}
          MATCHED_KEY: ${{ steps.model-cache.outputs.cache-matched-key }}
          DOWNLOADED: ${{ steps.prepare-models.outputs.downloaded }}
        run: |
          key="$MATCHED_KEY"
          if [ "$DOWNLOADED" = true ] || [ -z "$key" ]; then key="$PRIMARY_KEY"; fi
          test -n "$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          # Remove the verified local copy; restoration must come from Actions cache.
          rm -rf -- "$RUNNER_TEMP/orbit-ollama-models"
          test ! -e "$RUNNER_TEMP/orbit-ollama-models"
      - name: Restore exact cache into empty model directory
        id: warm-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/orbit-ollama-models
          key: ${{ steps.cache-roundtrip.outputs.key }}
          fail-on-cache-miss: true
      - name: Verify actual warm cache without pulls
        env:
          EXPECTED_KEY: ${{ steps.cache-roundtrip.outputs.key }}
          RESTORED_KEY: ${{ steps.warm-cache.outputs.cache-matched-key }}
          EXACT_HIT: ${{ steps.warm-cache.outputs.cache-hit }}
        run: |
          test "$EXACT_HIT" = true
          test "$EXPECTED_KEY" = "$RESTORED_KEY"
          python tools/model_cache.py verify --root "$RUNNER_TEMP/orbit-ollama-models" --report "$RUNNER_TEMP/offline-report/model-cache-warm.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=Path(os.environ['RUNNER_TEMP'])/'offline-report'
          first=json.loads((d/'model-cache.json').read_text())
          warm=json.loads((d/'model-cache-warm.json').read_text())
          assert first['gate']==warm['gate']=='PASS'
          assert first['models']==warm['models'] and warm['downloaded_models']==[]
          report=dict(schema='orbit.model-cache-roundtrip.v1',gate='PASS',
                      source_commit=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],
                      run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],cache_key=os.environ['EXPECTED_KEY'],
                      exact_cache_hit=True,initial_downloads=first['downloaded_models'],warm_downloads=[],
                      models=warm['models'])
          (d/'model-cache-roundtrip.json').write_text(json.dumps(report,indent=2)+'\n')
          print('REAL CACHE ROUNDTRIP PASS; no model pulls after exact restore')
          PY
      - name: Start inference runtime with no external network
        run: |
          mkdir -p "$RUNNER_TEMP/offline-report" "$RUNNER_TEMP/offline-private"
          chmod 700 "$RUNNER_TEMP/offline-private"
          docker run -d --name orbit-airgap --network none --memory 6g --memory-swap 6g --cpus 2 -e OLLAMA_NO_CLOUD=1 -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_MAX_LOADED_MODELS=1 -e OLLAMA_CONTEXT_LENGTH=8192 -e OLLAMA_MODELS=/models -v "$RUNNER_TEMP/orbit-ollama-models:/models" ollama/ollama:latest
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' orbit-airgap)" = none
          for i in $(seq 1 60); do
            if docker exec orbit-airgap ollama list; then break; fi
            sleep 1
          done
          docker exec orbit-airgap ollama show qwen2.5-coder:3b >/dev/null
          docker exec orbit-airgap ollama show qwen2.5:3b >/dev/null
      - name: Generate, review, sandbox and repair up to two times
        run: |
          image="$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')"
          for round in 0 1 2; do
            extra=()
            if [ "$round" -gt 0 ]; then
              prev=$((round-1))
              extra=(--repair-db "/private/round-$prev.sqlite" --repair-report "/report/round-$prev-sandbox.json")
            fi
            echo "P4.6 attempt $((round+1))/3"
            timeout 12m docker run --rm --user "$(id -u):$(id -g)" --network container:orbit-airgap --mount "type=bind,src=$PWD,dst=/repo,readonly" --mount "type=bind,src=$RUNNER_TEMP/offline-report,dst=/report" --mount "type=bind,src=$RUNNER_TEMP/offline-private,dst=/private" -e PYTHONDONTWRITEBYTECODE=1 -e ORBIT_RESOURCE_MODE=enforce -e ORBIT_RESOURCE_MIN_FREE_MIB=64 -e ORBIT_RESOURCE_MAX_MEMORY_PERCENT=99 python:3.12-slim python /repo/tools/offline_inference_smoke.py --workflow --db-output "/private/round-$round.sqlite" --report "/report/round-$round-inference.json" --confirm 'RUN LOCAL INFERENCE' "${extra[@]}"
            jid="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["workflow"]["job_id"])' "$RUNNER_TEMP/offline-report/round-$round-inference.json")"
            status=0
            python tools/offline_sandbox_gate.py --db "$RUNNER_TEMP/offline-private/round-$round.sqlite" --inference-report "$RUNNER_TEMP/offline-report/round-$round-inference.json" --image "$image" --output "$RUNNER_TEMP/offline-report/round-$round-sandbox.json" --confirm "RUN OFFLINE SANDBOX $jid" || status=$?
            if [ "$status" -eq 0 ]; then
              echo "P4.6 PASS on attempt $((round+1))"
              exit 0
            fi
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          done
          echo "P4.6 BLOCK: repair budget exhausted"
          exit 2
      - name: Verify concurrent client inference against offline Ollama
        run: |
          timeout 8m docker run --rm --user "$(id -u):$(id -g)" --network container:orbit-airgap --mount "type=bind,src=$PWD,dst=/repo,readonly" --mount "type=bind,src=$RUNNER_TEMP/offline-report,dst=/report" -e PYTHONDONTWRITEBYTECODE=1 python:3.12-slim python /repo/tools/offline_concurrency_smoke.py --report /report/concurrency.json --confirm 'RUN LOCAL CONCURRENCY'
      - name: Verify smart routing against actual offline models
        run: |
          timeout 8m docker run --rm --user "$(id -u):$(id -g)" --network container:orbit-airgap --mount "type=bind,src=$PWD,dst=/repo,readonly" --mount "type=bind,src=$RUNNER_TEMP/offline-report,dst=/report" -e PYTHONDONTWRITEBYTECODE=1 -e ORBIT_RESOURCE_MODE=enforce -e ORBIT_RESOURCE_MIN_FREE_MIB=64 -e ORBIT_RESOURCE_MAX_MEMORY_PERCENT=99 python:3.12-slim python /repo/tools/offline_routing_smoke.py --report /report/routing.json --confirm 'RUN LOCAL ROUTING'
      - name: Verify budget admission against actual offline model
        run: |
          timeout 8m docker run --rm --user "$(id -u):$(id -g)" --network container:orbit-airgap --mount "type=bind,src=$PWD,dst=/repo,readonly" --mount "type=bind,src=$RUNNER_TEMP/offline-report,dst=/report" -e PYTHONDONTWRITEBYTECODE=1 python:3.12-slim python /repo/tools/offline_budget_smoke.py --report /report/protection.json --confirm 'RUN LOCAL BUDGET'
      - name: P5.9 real 24-agent offline stress smoke (not 24h)
        run: |
          timeout 12m docker run --rm --user "$(id -u):$(id -g)" --network container:orbit-airgap --mount "type=bind,src=$PWD,dst=/repo,readonly" --mount "type=bind,src=$RUNNER_TEMP/offline-report,dst=/report" -e PYTHONDONTWRITEBYTECODE=1 -e STRESS_SOURCE_COMMIT="$GITHUB_SHA" python:3.12-slim python /repo/tools/offline_stress.py --profile smoke --report /report/stress-smoke.json --confirm 'RUN LOCAL STRESS SMOKE'
      - name: P6.1 — actual Research, BA, PO collaboration and approval storage
        run: |
          timeout 30m docker run --rm --user "$(id -u):$(id -g)" --network container:orbit-airgap --mount "type=bind,src=$PWD,dst=/repo,readonly" --mount "type=bind,src=$RUNNER_TEMP/offline-report,dst=/report" -e PYTHONDONTWRITEBYTECODE=1 -e STRESS_SOURCE_COMMIT="$GITHUB_SHA" -e ORBIT_RESOURCE_MODE=enforce -e ORBIT_RESOURCE_MIN_FREE_MIB=64 -e ORBIT_RESOURCE_MAX_MEMORY_PERCENT=99 python:3.12-slim python /repo/tools/offline_requirements_smoke.py --report /report/requirements.json --confirm 'RUN LOCAL REQUIREMENTS'
      - name: P6.2j — actual local PM full planning acceptance
        run: |
          timeout 25m docker run --rm --user "$(id -u):$(id -g)" --network container:orbit-airgap --mount "type=bind,src=$PWD,dst=/repo,readonly" --mount "type=bind,src=$RUNNER_TEMP/offline-report,dst=/report" -e PYTHONDONTWRITEBYTECODE=1 -e STRESS_SOURCE_COMMIT="$GITHUB_SHA" -e ORBIT_RESOURCE_MODE=enforce -e ORBIT_RESOURCE_MIN_FREE_MIB=64 -e ORBIT_RESOURCE_MAX_MEMORY_PERCENT=99 python:3.12-slim python /repo/tools/offline_planning_smoke.py --report /report/planning.json --confirm 'RUN LOCAL PLANNING'
      - name: Verify actual Ollama container resource bounds
        if: always()
        run: python tools/resource_container_evidence.py "$RUNNER_TEMP/offline-report/container-resources.json"
      - name: Retain model inference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-inference-report
          path: ${{ runner.temp }}/offline-report/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Cleanup
        if: always()
        run: |
          docker rm -f orbit-airgap orbit-download || true
          rm -rf "$RUNNER_TEMP/offline-private"
