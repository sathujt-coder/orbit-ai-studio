name: ORBIT CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Python tests and JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source files were delivered
        run: |
          test -f backend/server.py
          test -f backend/model_provider.py
          test -f tools/probe_models.py
          test -f backend/coding_factory.py
          test -f backend/verification_factory.py
          test -f backend/verified_pr.py
          test -f tools/verify_coding_job.py
          test -f tools/publish_verified_code.py
          test -f web/app.js
          test -f web/world3d.js
          test -f tests/test_coding_factory.py
          test -f tests/test_verification_factory.py
          test -f tests/test_verified_pr.py
      - name: Release preflight
        run: python tools/validate_release.py
      - name: Compile Python
        run: python -m compileall -q backend tools tests
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Validate frontend syntax
        run: |
          node --check web/app.js
          node --check web/studio-line.js
          node --check web/world3d.js
          node --check web/auth-account.js
          node --check web/access.js
          node --check web/providers.js
          node --check web/usage.js
          node --check web/cost.js
          node --check web/resources.js
          node --check web/queue.js
          node --check web/routing.js
          node --check web/protection.js
          node --check web/monitoring.js
          node --check web/requirements.js
          node --check web/planning.js

  web-e2e:
    name: Browser E2E — Chromium
    # Playwright 1.56.1 supports Ubuntu 24.04; ubuntu-latest currently resolves to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright package
        run: npm install --no-save --ignore-scripts playwright@1.56.1 react@19.2.0 react-dom@19.2.0 esbuild@0.25.12
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Start isolated ORBIT backend
        run: |
          export AI_PROVIDER=demo AI_HOST=127.0.0.1 AI_PORT=8787 ORBIT_PROVIDER_ADMINS=ci-browser-user ORBIT_QUEUE_WORKERS=2 ORBIT_MONITOR_INTERVAL=5
          export AI_COMPANY_DB="$RUNNER_TEMP/orbit-web-e2e.sqlite"
          python backend/server.py > "$RUNNER_TEMP/orbit-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/orbit-server.pid"
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/orbit-server.log"
          exit 1
      - name: Provision isolated browser-test account
        run: |
          PYTHONPATH=backend python -c "import os, sqlite3, auth_store; c=sqlite3.connect(os.environ['RUNNER_TEMP']+'/orbit-web-e2e.sqlite'); auth_store.create_user(c,'ci-browser-user','local-ci-fixture-password'); auth_store.create_user(c,'ci-viewer','local-ci-fixture-password'); pid=c.execute('SELECT id FROM projects LIMIT 1').fetchone()[0]; auth_store.grant(c,'ci-browser-user',pid,'owner'); auth_store.grant(c,'ci-viewer',pid,'viewer'); c.commit(); c.close()"
      - name: Run real Chromium E2E
        run: node --test tests/browser/studio-line.test.cjs tests/browser/web-first.test.cjs tests/browser/react-interaction.test.cjs tests/browser/auth-account.test.cjs tests/browser/security.test.cjs tests/browser/provider-settings.test.cjs tests/browser/token-usage.test.cjs tests/browser/ai-cost.test.cjs tests/browser/resources.test.cjs tests/browser/agent-queue.test.cjs tests/browser/concurrency.test.cjs tests/browser/routing.test.cjs tests/browser/protection.test.cjs tests/browser/monitoring.test.cjs
      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-web-e2e-logs
          path: ${{ runner.temp }}/orbit-server.log
          retention-days: 7

  requirements-browser:
    name: P6.1 Browser E2E — isolated synthetic inference
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    outputs:
      dependency_evidence_sha256: ${{ steps.dependency-evidence.outputs.evidence_sha256 }}
      sandbox_evidence_sha256: ${{ steps.engineering-sandbox-evidence.outputs.evidence_sha256 }}
      draft_evidence_sha256: ${{ steps.engineering-draft-evidence.outputs.evidence_sha256 }}
      quality_evidence_sha256: ${{ steps.engineering-quality-evidence.outputs.evidence_sha256 }}
      workflow_evidence_sha256: ${{ steps.engineering-workflow-evidence.outputs.evidence_sha256 }}
      qc_evidence_sha256: ${{ steps.engineering-qc-evidence.outputs.evidence_sha256 }}
      test_plan_evidence_sha256: ${{ steps.test-plan-evidence.outputs.evidence_sha256 }}
      assertion_evidence_sha256: ${{ steps.assertion-evidence.outputs.evidence_sha256 }}
      runner_evidence_sha256: ${{ steps.runner-evidence.outputs.evidence_sha256 }}
      registry_evidence_sha256: ${{ steps.registry-evidence.outputs.evidence_sha256 }}
      execution_gate_evidence_sha256: ${{ steps.execution-gate-evidence.outputs.evidence_sha256 }}
      final_execution_evidence_sha256: ${{ steps.final-execution-evidence.outputs.evidence_sha256 }}
      git_change_evidence_sha256: ${{ steps.git-change-evidence.outputs.evidence_sha256 }}
      dependency_impact_evidence_sha256: ${{ steps.dependency-impact-evidence.outputs.evidence_sha256 }}
      impacted_test_evidence_sha256: ${{ steps.impacted-test-evidence.outputs.evidence_sha256 }}
      regression_priority_evidence_sha256: ${{ steps.regression-priority-evidence.outputs.evidence_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Prepare pinned real engineering sandbox image
        run: |
          docker pull python:3.12-alpine
          image="$(docker image inspect python:3.12-alpine --format '{{index .RepoDigests 0}}')"
          echo "ORBIT_SANDBOX_PYTHON_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Start isolated HTTP and durable queue fixture
        run: |
          export ORBIT_REQUIREMENTS_BROWSER_FIXTURE=1 AI_PROVIDER=ollama AI_MODEL_A=fixture-a AI_MODEL_B=fixture-b AI_HOST=127.0.0.1 AI_PORT=8787 ORBIT_MAX_RUN_CALLS=20
          export AI_COMPANY_DB="$RUNNER_TEMP/requirements-browser.sqlite"
          python tests/browser/requirements_fixture.py > "$RUNNER_TEMP/requirements-browser.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/requirements-browser.pid"
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/requirements-browser.log"
          exit 1
      - name: Requirements Chromium acceptance
        env:
          ORBIT_REQUIREMENTS_BROWSER_FIXTURE: '1'
          AI_PROVIDER: ollama
          AI_MODEL_A: fixture-a
          AI_MODEL_B: fixture-b
          AI_HOST: 127.0.0.1
          AI_PORT: '8787'
          ORBIT_MAX_RUN_CALLS: '20'
          AI_COMPANY_DB: ${{ runner.temp }}/requirements-browser.sqlite
          ORBIT_DEPENDENCY_EVIDENCE: ${{ runner.temp }}/dependency-browser-evidence.json
          ORBIT_ENGINEERING_SANDBOX_EVIDENCE: ${{ runner.temp }}/engineering-sandbox-evidence.json
          ORBIT_ENGINEERING_DRAFT_EVIDENCE: ${{ runner.temp }}/engineering-draft-evidence.json
          ORBIT_ENGINEERING_QUALITY_EVIDENCE: ${{ runner.temp }}/engineering-quality-evidence.json
          ORBIT_ENGINEERING_WORKFLOW_EVIDENCE: ${{ runner.temp }}/engineering-workflow-evidence.json
          ORBIT_ENGINEERING_QC_EVIDENCE: ${{ runner.temp }}/engineering-qc-evidence.json
          ORBIT_TEST_PLAN_EVIDENCE: ${{ runner.temp }}/engineering-test-plan-evidence.json
          ORBIT_ASSERTION_CONTRACT_EVIDENCE: ${{ runner.temp }}/engineering-assertion-contract-evidence.json
          ORBIT_ASSERTION_RUNNER_EVIDENCE: ${{ runner.temp }}/engineering-assertion-runner-evidence.json
          ORBIT_ASSERTION_REGISTRY_EVIDENCE: ${{ runner.temp }}/engineering-assertion-registry-evidence.json
          ORBIT_EXECUTION_GATE_EVIDENCE: ${{ runner.temp }}/engineering-execution-gate-evidence.json
          ORBIT_FINAL_EXECUTION_EVIDENCE: ${{ runner.temp }}/engineering-final-execution-evidence.json
          ORBIT_GIT_CHANGE_EVIDENCE: ${{ runner.temp }}/engineering-git-change-evidence.json
          ORBIT_DEPENDENCY_IMPACT_EVIDENCE: ${{ runner.temp }}/engineering-dependency-impact-evidence.json
          ORBIT_IMPACTED_TEST_EVIDENCE: ${{ runner.temp }}/engineering-impacted-test-evidence.json
          ORBIT_REGRESSION_PRIORITY_EVIDENCE: ${{ runner.temp }}/engineering-regression-priority-evidence.json
        run: |
          set -o pipefail
          node --test tests/browser/requirements.test.cjs tests/browser/planning.test.cjs | tee "$RUNNER_TEMP/planning-browser.tap"
      - name: Validate dependency integration evidence
        id: dependency-evidence
        run: python tools/dependency_acceptance.py "$RUNNER_TEMP/dependency-browser-evidence.json"
      - name: Validate real Git sandbox integration evidence
        id: engineering-sandbox-evidence
        run: python tools/engineering_sandbox_acceptance.py "$RUNNER_TEMP/engineering-sandbox-evidence.json"
      - name: Validate draft PR integration evidence
        id: engineering-draft-evidence
        run: python tools/engineering_draft_acceptance.py "$RUNNER_TEMP/engineering-draft-evidence.json" "$RUNNER_TEMP/engineering-sandbox-evidence.json"
      - name: Validate engineering quality evidence
        id: engineering-quality-evidence
        run: python tools/engineering_quality_acceptance.py "$RUNNER_TEMP/engineering-quality-evidence.json" "$RUNNER_TEMP/engineering-sandbox-evidence.json" "$RUNNER_TEMP/engineering-draft-evidence.json"
      - name: Validate engineering workflow continuity evidence
        id: engineering-workflow-evidence
        run: python tools/engineering_workflow_acceptance.py "$RUNNER_TEMP/engineering-workflow-evidence.json"
      - name: Validate consolidated QA/QC evidence
        id: engineering-qc-evidence
        run: python tools/engineering_qc_acceptance.py "$RUNNER_TEMP/engineering-qc-evidence.json" "$RUNNER_TEMP/engineering-sandbox-evidence.json" "$RUNNER_TEMP/engineering-quality-evidence.json" "$RUNNER_TEMP/engineering-draft-evidence.json"
      - name: Validate acceptance test plan evidence
        id: test-plan-evidence
        run: python tools/engineering_test_plan_acceptance.py "$RUNNER_TEMP/engineering-test-plan-evidence.json" "$RUNNER_TEMP/engineering-qc-evidence.json"
      - name: Validate executable assertion contract
        id: assertion-evidence
        run: python tools/engineering_assertion_acceptance.py "$RUNNER_TEMP/engineering-assertion-contract-evidence.json" "$RUNNER_TEMP/engineering-test-plan-evidence.json"
      - name: Real Docker assertion negative and failure probes
        env:
          ORBIT_ASSERTION_REAL_DOCKER: '1'
        run: python -m unittest discover -s tests -p test_acceptance_runner.py -v
      - name: Validate real individual assertion execution
        id: runner-evidence
        run: python tools/engineering_runner_acceptance.py "$RUNNER_TEMP/engineering-assertion-runner-evidence.json" "$RUNNER_TEMP/engineering-assertion-contract-evidence.json" "$RUNNER_TEMP/engineering-sandbox-evidence.json"
      - name: Validate immutable assertion registry
        id: registry-evidence
        run: python tools/engineering_registry_acceptance.py "$RUNNER_TEMP/engineering-assertion-registry-evidence.json" "$RUNNER_TEMP/engineering-assertion-runner-evidence.json" "$RUNNER_TEMP/engineering-assertion-contract-evidence.json"
      - name: Validate combined execution quality gate
        id: execution-gate-evidence
        run: python tools/engineering_execution_gate_acceptance.py "$RUNNER_TEMP/engineering-execution-gate-evidence.json" "$RUNNER_TEMP/engineering-qc-evidence.json" "$RUNNER_TEMP/engineering-assertion-contract-evidence.json" "$RUNNER_TEMP/engineering-assertion-registry-evidence.json"
      - name: Validate final real assertion failure and recovery evidence
        id: final-execution-evidence
        run: python tools/engineering_final_execution_acceptance.py "$RUNNER_TEMP/engineering-final-execution-evidence.json" "$RUNNER_TEMP/engineering-qc-evidence.json" "$RUNNER_TEMP/engineering-assertion-contract-evidence.json" "$RUNNER_TEMP/engineering-assertion-registry-evidence.json" "$RUNNER_TEMP/engineering-execution-gate-evidence.json"
      - name: Validate exact Git change evidence
        id: git-change-evidence
        run: python tools/engineering_git_change_acceptance.py "$RUNNER_TEMP/engineering-git-change-evidence.json" "$RUNNER_TEMP/engineering-sandbox-evidence.json" "$RUNNER_TEMP/engineering-final-execution-evidence.json"
      - name: Validate dependency impact evidence
        id: dependency-impact-evidence
        run: python tools/engineering_dependency_impact_acceptance.py "$RUNNER_TEMP/engineering-dependency-impact-evidence.json" "$RUNNER_TEMP/engineering-git-change-evidence.json"
      - name: Validate impacted test mapping evidence
        id: impacted-test-evidence
        run: python tools/engineering_impacted_test_acceptance.py "$RUNNER_TEMP/engineering-impacted-test-evidence.json" "$RUNNER_TEMP/engineering-dependency-impact-evidence.json" "$RUNNER_TEMP/engineering-assertion-contract-evidence.json" "$RUNNER_TEMP/engineering-assertion-runner-evidence.json" "$RUNNER_TEMP/engineering-final-execution-evidence.json"
      - name: Validate prioritized full regression evidence
        id: regression-priority-evidence
        run: python tools/engineering_regression_priority_acceptance.py "$RUNNER_TEMP/engineering-regression-priority-evidence.json" "$RUNNER_TEMP/engineering-impacted-test-evidence.json" "$RUNNER_TEMP/engineering-final-execution-evidence.json"
      - name: Retain prioritized full regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: engineering-regression-priority-evidence
          path: ${{ runner.temp }}/engineering-regression-priority-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain impacted test mapping evidence
        uses: actions/upload-artifact@v4
        with:
          name: engineering-impacted-test-evidence
          path: ${{ runner.temp }}/engineering-impacted-test-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain dependency impact evidence
        uses: actions/upload-artifact@v4
        with:
          name: engineering-dependency-impact-evidence
          path: ${{ runner.temp }}/engineering-dependency-impact-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain Git change evidence
        uses: actions/upload-artifact@v4
        with:
          name: engineering-git-change-evidence
          path: ${{ runner.temp }}/engineering-git-change-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain final automated execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: engineering-final-execution-evidence
          path: ${{ runner.temp }}/engineering-final-execution-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain execution quality gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: engineering-execution-gate-evidence
          path: ${{ runner.temp }}/engineering-execution-gate-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain assertion registry evidence
        uses: actions/upload-artifact@v4
        with:
          name: engineering-assertion-registry-evidence
          path: ${{ runner.temp }}/engineering-assertion-registry-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain assertion runner evidence
        uses: actions/upload-artifact@v4
        with:
          name: engineering-assertion-runner-evidence
          path: ${{ runner.temp }}/engineering-assertion-runner-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain executable assertion evidence
        uses: actions/upload-artifact@v4
        with:
          name: engineering-assertion-contract-evidence
          path: ${{ runner.temp }}/engineering-assertion-contract-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain acceptance test plan evidence
        uses: actions/upload-artifact@v4
        with:
          name: engineering-test-plan-evidence
          path: ${{ runner.temp }}/engineering-test-plan-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain QA/QC evidence
        uses: actions/upload-artifact@v4
        with:
          name: engineering-qc-evidence
          path: ${{ runner.temp }}/engineering-qc-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain engineering workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: engineering-workflow-evidence
          path: ${{ runner.temp }}/engineering-workflow-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain engineering quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: engineering-quality-evidence
          path: ${{ runner.temp }}/engineering-quality-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain draft PR integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: engineering-draft-evidence
          path: ${{ runner.temp }}/engineering-draft-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain real Git sandbox integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: engineering-sandbox-evidence
          path: ${{ runner.temp }}/engineering-sandbox-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain verified dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-browser-evidence
          path: ${{ runner.temp }}/dependency-browser-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain browser diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p61-browser-diagnostics
          path: |
            ${{ runner.temp }}/requirements-browser.log
            ${{ runner.temp }}/planning-browser.tap
          retention-days: 7
      - name: Stop fixture
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/requirements-browser.pid" ]; then kill "$(cat "$RUNNER_TEMP/requirements-browser.pid")" || true; fi

  studio-system-acceptance:
    name: P6.4d.4 — Prioritized full regression execution acceptance
    needs: [validate, web-e2e, requirements-browser, web-typescript-docker, react-offline-smoke, p4-fixture-e2e, tls-container-smoke, proxy-container-smoke, stress-fixture, planning-system-acceptance]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record Studio-specific acceptance
        env:
          STUDIO_NEEDS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, re
          required = ["validate","web-e2e","requirements-browser","web-typescript-docker","react-offline-smoke","p4-fixture-e2e","tls-container-smoke","proxy-container-smoke","stress-fixture","planning-system-acceptance"]
          actual = json.loads(os.environ['STUDIO_NEEDS'])
          checks = {key: actual.get(key, {}).get('result', 'missing') for key in required}
          evidence_sha256 = actual.get('requirements-browser', {}).get('outputs', {}).get('dependency_evidence_sha256', '')
          evidence_valid = isinstance(evidence_sha256, str) and bool(re.fullmatch(r'[0-9a-f]{64}', evidence_sha256)) and checks['requirements-browser'] == 'success'
          sandbox_sha256 = actual.get('requirements-browser', {}).get('outputs', {}).get('sandbox_evidence_sha256', '')
          sandbox_valid = isinstance(sandbox_sha256,str) and bool(re.fullmatch(r'[0-9a-f]{64}',sandbox_sha256)) and checks['requirements-browser']=='success'
          draft_sha256 = actual.get('requirements-browser', {}).get('outputs', {}).get('draft_evidence_sha256', '')
          draft_valid = isinstance(draft_sha256,str) and bool(re.fullmatch(r'[0-9a-f]{64}',draft_sha256)) and checks['requirements-browser']=='success'
          quality_sha256 = actual.get('requirements-browser', {}).get('outputs', {}).get('quality_evidence_sha256', '')
          quality_valid = isinstance(quality_sha256,str) and bool(re.fullmatch(r'[0-9a-f]{64}',quality_sha256)) and checks['requirements-browser']=='success'
          workflow_sha256 = actual.get('requirements-browser', {}).get('outputs', {}).get('workflow_evidence_sha256', '')
          workflow_valid = isinstance(workflow_sha256,str) and bool(re.fullmatch(r'[0-9a-f]{64}',workflow_sha256)) and checks['requirements-browser']=='success'
          engineering_passed = set(actual) == set(required) and all(value == 'success' for value in checks.values()) and evidence_valid and sandbox_valid and draft_valid and quality_valid and workflow_valid
          qc_sha256 = actual.get('requirements-browser', {}).get('outputs', {}).get('qc_evidence_sha256', '')
          qc_valid = isinstance(qc_sha256,str) and bool(re.fullmatch(r'[0-9a-f]{64}',qc_sha256)) and checks['requirements-browser']=='success'
          test_plan_sha256 = actual.get('requirements-browser', {}).get('outputs', {}).get('test_plan_evidence_sha256', '')
          test_plan_valid = isinstance(test_plan_sha256,str) and bool(re.fullmatch(r'[0-9a-f]{64}',test_plan_sha256)) and checks['requirements-browser']=='success'
          assertion_sha256 = actual.get('requirements-browser', {}).get('outputs', {}).get('assertion_evidence_sha256', '')
          assertion_valid = isinstance(assertion_sha256,str) and bool(re.fullmatch(r'[0-9a-f]{64}',assertion_sha256)) and checks['requirements-browser']=='success'
          runner_sha256 = actual.get('requirements-browser', {}).get('outputs', {}).get('runner_evidence_sha256', '')
          runner_valid = isinstance(runner_sha256,str) and bool(re.fullmatch(r'[0-9a-f]{64}',runner_sha256)) and checks['requirements-browser']=='success'
          registry_sha256 = actual.get('requirements-browser', {}).get('outputs', {}).get('registry_evidence_sha256', '')
          registry_valid = isinstance(registry_sha256,str) and bool(re.fullmatch(r'[0-9a-f]{64}',registry_sha256)) and checks['requirements-browser']=='success'
          execution_gate_sha256 = actual.get('requirements-browser', {}).get('outputs', {}).get('execution_gate_evidence_sha256', '')
          execution_gate_valid = isinstance(execution_gate_sha256,str) and bool(re.fullmatch(r'[0-9a-f]{64}',execution_gate_sha256)) and checks['requirements-browser']=='success'
          final_execution_sha256 = actual.get('requirements-browser', {}).get('outputs', {}).get('final_execution_evidence_sha256', '')
          final_execution_valid = isinstance(final_execution_sha256,str) and bool(re.fullmatch(r'[0-9a-f]{64}',final_execution_sha256)) and checks['requirements-browser']=='success'
          git_change_sha256 = actual.get('requirements-browser', {}).get('outputs', {}).get('git_change_evidence_sha256', '')
          git_change_valid = isinstance(git_change_sha256,str) and bool(re.fullmatch(r'[0-9a-f]{64}',git_change_sha256)) and checks['requirements-browser']=='success'
          automated_execution_passed = engineering_passed and qc_valid and test_plan_valid and assertion_valid and runner_valid and registry_valid and execution_gate_valid and final_execution_valid
          dependency_impact_sha256 = actual.get('requirements-browser', {}).get('outputs', {}).get('dependency_impact_evidence_sha256', '')
          dependency_impact_valid = isinstance(dependency_impact_sha256,str) and bool(re.fullmatch(r'[0-9a-f]{64}',dependency_impact_sha256)) and checks['requirements-browser']=='success'
          impacted_test_sha256 = actual.get('requirements-browser', {}).get('outputs', {}).get('impacted_test_evidence_sha256', '')
          impacted_test_valid = isinstance(impacted_test_sha256,str) and bool(re.fullmatch(r'[0-9a-f]{64}',impacted_test_sha256)) and checks['requirements-browser']=='success'
          regression_priority_sha256 = actual.get('requirements-browser', {}).get('outputs', {}).get('regression_priority_evidence_sha256', '')
          regression_priority_valid = isinstance(regression_priority_sha256,str) and bool(re.fullmatch(r'[0-9a-f]{64}',regression_priority_sha256)) and checks['requirements-browser']=='success'
          passed = automated_execution_passed and git_change_valid and dependency_impact_valid and impacted_test_valid and regression_priority_valid
          report = dict(schema='orbit.studio-system-acceptance.v1',
                        milestone='P6.4d.4', source_commit=os.environ['GITHUB_SHA'],
                        run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                        checks=checks, dependency_integration_acceptance='PASS' if evidence_valid else 'BLOCK',
                        dependency_evidence_sha256=evidence_sha256 if evidence_valid else None,
                        engineering_sandbox_acceptance='PASS' if sandbox_valid else 'BLOCK',
                        engineering_sandbox_evidence_sha256=sandbox_sha256 if sandbox_valid else None,
                        engineering_draft_acceptance='PASS' if draft_valid else 'BLOCK',
                        engineering_draft_evidence_sha256=draft_sha256 if draft_valid else None,
                        engineering_quality_acceptance='PASS' if quality_valid else 'BLOCK',
                        engineering_quality_evidence_sha256=quality_sha256 if quality_valid else None,
                        engineering_workflow_acceptance='PASS' if workflow_valid else 'BLOCK',
                        engineering_workflow_evidence_sha256=workflow_sha256 if workflow_valid else None,
                        engineering_qc_acceptance='PASS' if qc_valid else 'BLOCK',
                        engineering_qc_evidence_sha256=qc_sha256 if qc_valid else None,
                        acceptance_test_plan_acceptance='PASS' if test_plan_valid else 'BLOCK',
                        acceptance_test_plan_evidence_sha256=test_plan_sha256 if test_plan_valid else None,
                        assertion_contract_acceptance='PASS' if assertion_valid else 'BLOCK',
                        assertion_contract_evidence_sha256=assertion_sha256 if assertion_valid else None,
                        assertion_runner_acceptance='PASS' if runner_valid else 'BLOCK',
                        assertion_runner_evidence_sha256=runner_sha256 if runner_valid else None,
                        assertion_registry_acceptance='PASS' if registry_valid else 'BLOCK',
                        assertion_registry_evidence_sha256=registry_sha256 if registry_valid else None,
                        execution_quality_gate_acceptance='PASS' if execution_gate_valid else 'BLOCK',
                        execution_quality_gate_evidence_sha256=execution_gate_sha256 if execution_gate_valid else None,
                        automated_test_execution_acceptance='PASS' if final_execution_valid else 'BLOCK',
                        automated_test_execution_evidence_sha256=final_execution_sha256 if final_execution_valid else None,
                        automated_test_execution_complete=automated_execution_passed,
                        git_change_detection_acceptance='PASS' if git_change_valid else 'BLOCK',
                        git_change_evidence_sha256=git_change_sha256 if git_change_valid else None,
                        dependency_impact_acceptance='PASS' if dependency_impact_valid else 'BLOCK',
                        dependency_impact_evidence_sha256=dependency_impact_sha256 if dependency_impact_valid else None,
                        impacted_test_mapping_acceptance='PASS' if impacted_test_valid else 'BLOCK',
                        impacted_test_evidence_sha256=impacted_test_sha256 if impacted_test_valid else None,
                        regression_priority_acceptance='PASS' if regression_priority_valid else 'BLOCK',
                        regression_priority_evidence_sha256=regression_priority_sha256 if regression_priority_valid else None,
                        system_acceptance='PASS' if passed else 'BLOCK',
                        development_next_phase='P6.4d.5' if passed else None,
                        engineering_phase_complete=engineering_passed,
                        development_scope='development_only',
                        transport='isolated_synthetic_inference_and_sandbox_fixture',
                        automatic_adoption=False, automatic_dispatch=False,
                        execution_authorized=False, merge_authorized=False,
                        real_ai_acceptance='NOT_ASSESSED', model_qualification='NOT_ASSESSED',
                        production_release_authorized=False)
          with open('studio-system-acceptance.json','x') as out:
              json.dump(report,out,indent=2)
          print(json.dumps(report,indent=2))
          raise SystemExit(0 if passed else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-system-acceptance
          path: studio-system-acceptance.json
          if-no-files-found: error
          retention-days: 14

  planning-system-acceptance:
    name: P6.2j — final system acceptance (not model qualification)
    needs: [validate, requirements-browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record independently scoped system acceptance
        env:
          REGRESSION_RESULT: ${{ needs.validate.result }}
          BROWSER_RESULT: ${{ needs.requirements-browser.result }}
        run: |
          python - <<'PY'
          import json, os
          checks = dict(regression=os.environ['REGRESSION_RESULT'],
                        browser=os.environ['BROWSER_RESULT'])
          passed = all(value == 'success' for value in checks.values())
          report = dict(schema='orbit.planning-system-acceptance.v1',
                        source_commit=os.environ['GITHUB_SHA'],
                        milestone='P6.2j', transport='isolated_synthetic_fixture',
                        checks=checks, system_acceptance='PASS' if passed else 'BLOCK',
                        model_qualification='NOT_ASSESSED',
                        real_ai_acceptance='NOT_ASSESSED',
                        production_release_authorized=False)
          with open('planning-system-acceptance.json', 'x') as out:
              json.dump(report, out, indent=2)
          print(json.dumps(report, indent=2))
          raise SystemExit(0 if passed else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-system-acceptance
          path: planning-system-acceptance.json
          if-no-files-found: error
          retention-days: 14

  web-typescript-docker:
    name: Real Docker TypeScript sandbox — two candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build offline-runtime toolchain image
        run: docker build --pull --tag orbit-web-ts:ci --file tools/web-sandbox/Dockerfile .
      - name: Run real isolated Docker checks for both candidates
        run: PYTHONPATH=tests python tools/web-sandbox/real_docker_smoke.py

  react-offline-smoke:
    name: Real Docker React offline component smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve toolchain lock and audit dependencies
        working-directory: tools/react-sandbox
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
      - name: Retain resolved dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: react-toolchain-lock
          path: tools/react-sandbox/package-lock.json
      - name: Build React toolchain
        run: docker build -t orbit-react:ci tools/react-sandbox
      - name: Run two real offline React fixtures
        run: python tools/react-sandbox/smoke.py

  p4-fixture-e2e:
    name: P4 workflow — trusted HTTP fixtures and real Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull Python image and resolve immutable digest
        run: |
          docker pull python:3.12-alpine
          image="$(docker image inspect python:3.12-alpine --format '{{index .RepoDigests 0}}')"
          echo "ORBIT_P4_FIXTURE_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Exercise complete fixture workflow in isolated SQLite and Docker
        run: python -m unittest discover -s tests -p test_p4_e2e.py -v

  tls-container-smoke:
    name: TLS container — local staging smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build image and create ephemeral TLS certificate
        run: |
          docker build -f deployment/Dockerfile -t orbit-tls:ci .
          mkdir -p deployment/tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost' -keyout deployment/tls/key.pem -out deployment/tls/cert.pem
          sudo chown -R 10001:10001 deployment/tls
          sudo chmod 600 deployment/tls/key.pem
          docker compose -f deployment/compose.yml up -d --build
          for i in $(seq 1 30); do
            if curl -fsS --cacert deployment/tls/cert.pem https://localhost:8443/healthz; then exit 0; fi
            sleep 1
          done
          docker compose -f deployment/compose.yml logs
          exit 1
      - name: Provision isolated TLS fixture user
        run: docker compose -f deployment/compose.yml exec -T orbit python -c "import sys,sqlite3; sys.path.insert(0,'backend'); import auth_store; c=sqlite3.connect('/data/company.sqlite'); auth_store.create_user(c,'ci-tls-user','fixture-tls-password'); c.commit(); c.close()"
      - name: Verify TLS, session and CSRF
        run: python deployment/tls_smoke.py deployment/tls/cert.pem
      - name: Tear down isolated instance
        if: always()
        run: docker compose -f deployment/compose.yml down -v

  proxy-container-smoke:
    name: Reverse proxy — TLS upstream and rate limits
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create distinct ephemeral certificates and start restricted stack
        run: |
          mkdir -p deployment/proxy-tls/{edge,upstream,trust}
          for role in edge upstream; do
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost' -keyout deployment/proxy-tls/$role/key.pem -out deployment/proxy-tls/$role/cert.pem
          done
          cp deployment/proxy-tls/upstream/cert.pem deployment/proxy-tls/trust/upstream.pem
          sudo chown 101:101 deployment/proxy-tls/edge/key.pem
          sudo chown 10001:10001 deployment/proxy-tls/upstream/key.pem
          sudo chmod 600 deployment/proxy-tls/{edge,upstream}/key.pem
          docker compose -f deployment/compose.proxy.yml up -d --build
          for i in $(seq 1 30); do
            if curl -fsS --cacert deployment/proxy-tls/edge/cert.pem https://localhost:9443/healthz; then exit 0; fi
            sleep 1
          done
          docker compose -f deployment/compose.proxy.yml logs
          exit 1
      - name: Confirm upstream has no published port
        run: |
          id="$(docker compose -f deployment/compose.proxy.yml ps -q orbit)"
          test "$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$id")" = '{}' || test "$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$id")" = 'null'
      - name: Provision fixture and verify HTTPS through reverse proxy
        run: |
          docker compose -f deployment/compose.proxy.yml exec -T orbit python -c "import sys,sqlite3; sys.path.insert(0,'backend'); import auth_store; c=sqlite3.connect('/data/company.sqlite'); auth_store.create_user(c,'ci-tls-user','fixture-tls-password'); c.commit(); c.close()"
          python deployment/tls_smoke.py deployment/proxy-tls/edge/cert.pem https://localhost:9443
          python deployment/proxy_smoke.py deployment/proxy-tls/edge/cert.pem
      - name: Validate certificate reload
        run: sh deployment/reload_proxy.sh
      - name: Tear down isolated stack
        if: always()
        run: docker compose -f deployment/compose.proxy.yml down -v

  stress-fixture:
    name: P5.9 — queue, crash and HTTP stress fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated stress fixture
        run: python tools/stress_fixture.py --report "$RUNNER_TEMP/stress-fixture.json" --confirm 'RUN ISOLATED STRESS FIXTURE'
      - name: Retain fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-fixture-report
          path: ${{ runner.temp }}/stress-fixture.json
          if-no-files-found: warn
          retention-days: 7
