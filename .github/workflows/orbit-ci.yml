name: ORBIT CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Python tests and JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source files were delivered
        run: |
          test -f backend/server.py
          test -f backend/model_provider.py
          test -f tools/probe_models.py
          test -f backend/coding_factory.py
          test -f backend/verification_factory.py
          test -f backend/verified_pr.py
          test -f tools/verify_coding_job.py
          test -f tools/publish_verified_code.py
          test -f web/app.js
          test -f web/world3d.js
          test -f tests/test_coding_factory.py
          test -f tests/test_verification_factory.py
          test -f tests/test_verified_pr.py
      - name: Release preflight
        run: python tools/validate_release.py
      - name: Compile Python
        run: python -m compileall -q backend tools tests
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Validate frontend syntax
        run: |
          node --check web/app.js
          node --check web/world3d.js
          node --check web/auth-account.js
          node --check web/access.js
          node --check web/providers.js
          node --check web/usage.js
          node --check web/cost.js
          node --check web/resources.js
          node --check web/queue.js
          node --check web/routing.js
          node --check web/protection.js

  web-e2e:
    name: Browser E2E — Chromium
    # Playwright 1.56.1 supports Ubuntu 24.04; ubuntu-latest currently resolves to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright package
        run: npm install --no-save --ignore-scripts playwright@1.56.1 react@19.2.0 react-dom@19.2.0 esbuild@0.25.12
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Start isolated ORBIT backend
        run: |
          export AI_PROVIDER=demo AI_HOST=127.0.0.1 AI_PORT=8787 ORBIT_PROVIDER_ADMINS=ci-browser-user ORBIT_QUEUE_WORKERS=2
          export AI_COMPANY_DB="$RUNNER_TEMP/orbit-web-e2e.sqlite"
          python backend/server.py > "$RUNNER_TEMP/orbit-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/orbit-server.pid"
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/orbit-server.log"
          exit 1
      - name: Provision isolated browser-test account
        run: |
          PYTHONPATH=backend python -c "import os, sqlite3, auth_store; c=sqlite3.connect(os.environ['RUNNER_TEMP']+'/orbit-web-e2e.sqlite'); auth_store.create_user(c,'ci-browser-user','local-ci-fixture-password'); auth_store.create_user(c,'ci-viewer','local-ci-fixture-password'); pid=c.execute('SELECT id FROM projects LIMIT 1').fetchone()[0]; auth_store.grant(c,'ci-browser-user',pid,'owner'); auth_store.grant(c,'ci-viewer',pid,'viewer'); c.commit(); c.close()"
      - name: Run real Chromium E2E
        run: node --test tests/browser/web-first.test.cjs tests/browser/react-interaction.test.cjs tests/browser/auth-account.test.cjs tests/browser/security.test.cjs tests/browser/provider-settings.test.cjs tests/browser/token-usage.test.cjs tests/browser/ai-cost.test.cjs tests/browser/resources.test.cjs tests/browser/agent-queue.test.cjs tests/browser/concurrency.test.cjs tests/browser/routing.test.cjs tests/browser/protection.test.cjs
      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-web-e2e-logs
          path: ${{ runner.temp }}/orbit-server.log
          retention-days: 7

  web-typescript-docker:
    name: Real Docker TypeScript sandbox — two candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build offline-runtime toolchain image
        run: docker build --pull --tag orbit-web-ts:ci --file tools/web-sandbox/Dockerfile .
      - name: Run real isolated Docker checks for both candidates
        run: PYTHONPATH=tests python tools/web-sandbox/real_docker_smoke.py

  react-offline-smoke:
    name: Real Docker React offline component smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve toolchain lock and audit dependencies
        working-directory: tools/react-sandbox
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
      - name: Retain resolved dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: react-toolchain-lock
          path: tools/react-sandbox/package-lock.json
      - name: Build React toolchain
        run: docker build -t orbit-react:ci tools/react-sandbox
      - name: Run two real offline React fixtures
        run: python tools/react-sandbox/smoke.py

  p4-fixture-e2e:
    name: P4 workflow — trusted HTTP fixtures and real Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull Python image and resolve immutable digest
        run: |
          docker pull python:3.12-alpine
          image="$(docker image inspect python:3.12-alpine --format '{{index .RepoDigests 0}}')"
          echo "ORBIT_P4_FIXTURE_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Exercise complete fixture workflow in isolated SQLite and Docker
        run: python -m unittest discover -s tests -p test_p4_e2e.py -v

  tls-container-smoke:
    name: TLS container — local staging smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build image and create ephemeral TLS certificate
        run: |
          docker build -f deployment/Dockerfile -t orbit-tls:ci .
          mkdir -p deployment/tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost' -keyout deployment/tls/key.pem -out deployment/tls/cert.pem
          sudo chown -R 10001:10001 deployment/tls
          sudo chmod 600 deployment/tls/key.pem
          docker compose -f deployment/compose.yml up -d --build
          for i in $(seq 1 30); do
            if curl -fsS --cacert deployment/tls/cert.pem https://localhost:8443/healthz; then exit 0; fi
            sleep 1
          done
          docker compose -f deployment/compose.yml logs
          exit 1
      - name: Provision isolated TLS fixture user
        run: docker compose -f deployment/compose.yml exec -T orbit python -c "import sys,sqlite3; sys.path.insert(0,'backend'); import auth_store; c=sqlite3.connect('/data/company.sqlite'); auth_store.create_user(c,'ci-tls-user','fixture-tls-password'); c.commit(); c.close()"
      - name: Verify TLS, session and CSRF
        run: python deployment/tls_smoke.py deployment/tls/cert.pem
      - name: Tear down isolated instance
        if: always()
        run: docker compose -f deployment/compose.yml down -v

  proxy-container-smoke:
    name: Reverse proxy — TLS upstream and rate limits
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create distinct ephemeral certificates and start restricted stack
        run: |
          mkdir -p deployment/proxy-tls/{edge,upstream,trust}
          for role in edge upstream; do
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost' -keyout deployment/proxy-tls/$role/key.pem -out deployment/proxy-tls/$role/cert.pem
          done
          cp deployment/proxy-tls/upstream/cert.pem deployment/proxy-tls/trust/upstream.pem
          sudo chown 101:101 deployment/proxy-tls/edge/key.pem
          sudo chown 10001:10001 deployment/proxy-tls/upstream/key.pem
          sudo chmod 600 deployment/proxy-tls/{edge,upstream}/key.pem
          docker compose -f deployment/compose.proxy.yml up -d --build
          for i in $(seq 1 30); do
            if curl -fsS --cacert deployment/proxy-tls/edge/cert.pem https://localhost:9443/healthz; then exit 0; fi
            sleep 1
          done
          docker compose -f deployment/compose.proxy.yml logs
          exit 1
      - name: Confirm upstream has no published port
        run: |
          id="$(docker compose -f deployment/compose.proxy.yml ps -q orbit)"
          test "$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$id")" = '{}' || test "$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$id")" = 'null'
      - name: Provision fixture and verify HTTPS through reverse proxy
        run: |
          docker compose -f deployment/compose.proxy.yml exec -T orbit python -c "import sys,sqlite3; sys.path.insert(0,'backend'); import auth_store; c=sqlite3.connect('/data/company.sqlite'); auth_store.create_user(c,'ci-tls-user','fixture-tls-password'); c.commit(); c.close()"
          python deployment/tls_smoke.py deployment/proxy-tls/edge/cert.pem https://localhost:9443
          python deployment/proxy_smoke.py deployment/proxy-tls/edge/cert.pem
      - name: Validate certificate reload
        run: sh deployment/reload_proxy.sh
      - name: Tear down isolated stack
        if: always()
        run: docker compose -f deployment/compose.proxy.yml down -v
