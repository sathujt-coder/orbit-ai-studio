name: ORBIT CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Python tests and JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source files were delivered
        run: |
          test -f backend/server.py
          test -f backend/coding_factory.py
          test -f web/app.js
          test -f web/world3d.js
          test -f tests/test_coding_factory.py
      - name: Compile Python
        run: python -m compileall -q backend tools tests
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Validate frontend syntax
        run: |
          node --check web/app.js
          node --check web/world3d.js
